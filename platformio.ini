; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:STC89C52RC]
platform = intel_mcs51
board = STC89C52RC
board_build.f_cpu = 12000000L
; 串口由本机选择，或在命令行使用 --upload-port 指定。
; 此板通过 SW2 手动断电再上电进入 STC 下载模式。默认 Upload 使用 115200
; baud 并尝试用串口控制线复位，实测会在切换波特率后报 incorrect frame start。
; 38400 baud 仍出现过间歇性帧错误，改用更保守的 9600 baud。
; 启动后等提示再操作 SW2。
upload_command = stcgal -P stc89 -p $UPLOAD_PORT -b 9600 $SOURCE
monitor_speed = 4800
monitor_echo = yes
